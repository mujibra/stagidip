openapi: 3.0.0
info:
  title: StagiDIP API
  description: API documentation for the StagiDIP application.
  version: 1.0.0
servers:
  - url: /api
paths:
  /bacth:
    get:
      summary: Get all batches
      responses:
        "200":
          description: A list of batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  totalDatas:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
    post:
      summary: Create a new batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: The created batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
  /bacth/{id}:
    get:
      summary: Get a batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The batch
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
    put:
      summary: Update a batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: The updated batch
